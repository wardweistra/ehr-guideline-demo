4" y="684" font-size="14" fill="#000" font-weight="bold" text-anchor="start" >Loader</text><text x="654" y="704" font-size="12" fill="#595959" font-weight="normal" text-anchor="start" >Node.js scripts</text><path d="M562 695 L638 695" fill="none" stroke="#EC7A08" stroke-width="2" stroke-linejoin="round" marker-end="url(#ao)"/><path d="M735 658 L735 610 L640 610 L640 449" fill="none" stroke="#EC7A08" stroke-width="2" stroke-linejoin="round" marker-end="url(#ao)"/><text x="628" y="600" font-size="11" fill="#595959" font-weight="normal" text-anchor="end" >test patients, translated to</text><text x="628" y="615" font-size="11" fill="#595959" font-weight="normal" text-anchor="end" >OpenMRS patients and orders</text><path d="M832 695 L880 695 L880 440 L918 440" fill="none" stroke="#EC7A08" stroke-width="2" stroke-linejoin="round" marker-end="url(#ao)"/><text x="890" y="600" font-size="11" fill="#595959" font-weight="normal" text-anchor="start" >guidelines,</text><text x="890" y="615" font-size="11" fill="#595959" font-weight="normal" text-anchor="start" >from source</text><circle cx="941" cy="650" r="11" fill="#006D8C"/><text x="941" y="654.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" >1</text><text x="960" y="654.5" font-size="12" fill="#000" font-weight="normal" text-anchor="start" >Hook call (patient-view), with FHIR data</text><circle cx="941" cy="677" r="11" fill="#C30072"/><text x="941" y="681.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" >2</text><text x="960" y="681.5" font-size="12" fill="#000" font-weight="normal" text-anchor="start" >Or: the service fetches the data itself</text><circle cx="941" cy="704" r="11" fill="#006D8C"/><text x="941" y="708.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" >3</text><text x="960" y="708.5" font-size="12" fill="#000" font-weight="normal" text-anchor="start" >Cards with recommendations</text><rect x="930" y="734" width="22" height="14" rx="4" fill="#fff" stroke="#11B5E9" stroke-width="1.5"/><text x="960" y="746" font-size="12" fill="#000" font-weight="normal" text-anchor="start" >stock open source</text><rect x="1100" y="734" width="22" height="14" rx="4" fill="#fff" stroke="#EC7A08" stroke-width="2.5"/><text x="1130" y="746" font-size="12" fill="#000" font-weight="normal" text-anchor="start" >made for this demo</text></svg>
