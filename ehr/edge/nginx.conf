# Edge of the EHR: everything goes to the stock OpenMRS gateway, with two
# additions that an EHR's server side would normally provide for CDS Hooks.

# 1. Access tokens for the FHIR API. OpenMRS knows sessions and passwords, but
#    not bearer tokens. So the access token that a CDS service gets with a hook
#    (fhirAuthorization) is the id of the user's own EHR session: the service
#    can read what that user can read, for as long as the session lasts.
#    A bearer token that comes in is turned back into the session cookie here;
#    /openmrs/cds-hooks-token (below) hands the token to the CDS Hooks module.
#    Good enough for a demo; a real EHR issues short-lived, read-only tokens.
map $http_authorization $ehr_cookie {
  default                         $http_cookie;
  "~^Bearer (?<token>[\w.-]+)$"   "JSESSIONID=$token";
}
map $http_authorization $ehr_authorization {
  default      $http_authorization;
  "~^Bearer "  "";
}

server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 2. Relay for CDS Hooks calls. CDS services are called by the EHR's server,
  #    not by the browser, so the CDS Hooks module sends its calls here:
  #    /openmrs/cds-hooks-relay/http/cds:8080/cds-services -> http://cds:8080/cds-services
  #    Only for users that are logged in to the EHR; nothing of their session is passed on.
  location ~ ^/openmrs/cds-hooks-relay/(?<cds_scheme>https?)/(?<cds_target>.+)$ {
    auth_request /cds-hooks-relay-auth;
    proxy_set_header Host $proxy_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_ssl_server_name on;
    proxy_pass $cds_scheme://$cds_target$is_args$args;
  }

  # Succeeds only with a valid EHR session: a request that OpenMRS refuses when not logged in
  location = /cds-hooks-relay-auth {
    internal;
    set $gateway http://gateway;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_pass $gateway/openmrs/ws/rest/v1/provider?limit=1&v=ref;
  }

  # The access token for the session of whoever asks (see 1)
  location = /openmrs/cds-hooks-token {
    default_type application/json;
    add_header Cache-Control no-store;
    return 200 '{"access_token":"$cookie_JSESSIONID","token_type":"Bearer","expires_in":300,"scope":"user/*.read","subject":"cds-hooks-client"}';
  }

  location / {
    set $gateway http://gateway;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $ehr_cookie;
    proxy_set_header Authorization $ehr_authorization;
    proxy_pass $gateway;
  }
}
